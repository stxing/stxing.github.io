<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stxing · 个人主页</title>
  <style>
    :root {
      --bg: #0f1117;
      --fg: #e6e6e6;
      --muted: #9aa0a6;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card { text-align: center; padding: 48px; max-width: 560px; }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); display: inline-block;
      margin-bottom: 22px; box-shadow: 0 0 22px var(--accent);
    }
    h1 { font-size: 2.4rem; margin-bottom: 14px; letter-spacing: 0.5px; }
    p { color: var(--muted); line-height: 1.8; font-size: 1.05rem; }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .2s; }
    a:hover { border-color: var(--accent); }
    footer { margin-top: 28px; font-size: .85rem; color: #6b7177; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Hi, I'm stxing 👋</h1>
    <p>
      这是我的 GitHub Pages 个人主页。<br />
      欢迎通过 <a href="https://github.com/stxing">@stxing</a> 找到我。
    </p>
    <footer>Deployed with GitHub Pages · 免费且自动启用 HTTPS</footer>
  </div>
</body>
</html>
